[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermeskanban-clickup"
version = "0.1.0"
description = "Bidirectional reconciliation between Hermes Agent Kanban boards and ClickUp Lists"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Contributors"}]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
hermes-clickup-sync = "hermes_clickup_sync.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
